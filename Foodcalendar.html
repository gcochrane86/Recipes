<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreshPlate Planner</title>
  <style>
    :root {
      --primary: #10843f;
      --primary-light: #e8f5e9;
      --bg-app: #f4f6f8;
      --surface: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .phone-frame {
      width: 390px;
      height: 820px;
      background: var(--surface);
      border-radius: 44px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45), 0 0 0 10px #334155;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .notch {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 28px;
      background: #000;
      border-radius: 20px;
      z-index: 50;
    }

    .app-header {
      padding: 48px 18px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .app-header h1 {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--primary);
    }

    .week-pill {
      background: var(--primary-light);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .viewport {
      flex: 1;
      overflow-y: auto;
      background: var(--bg-app);
      padding: 14px;
      position: relative;
    }

    .hidden {
      display: none !important;
    }

    .day-heading {
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin: 10px 0 8px 4px;
    }

    .meal-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 10px;
      overflow: hidden;
      display: flex;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .meal-card:active {
      transform: scale(0.98);
    }

    .meal-thumb {
      width: 105px;
      min-width: 105px;
      height: 90px;
      object-fit: cover;
      background: #eee;
    }

    .meal-info {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      flex: 1;
    }

    .meal-tag {
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--primary);
    }

    .meal-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
    }

    .meal-meta {
      font-size: 0.72rem;
      color: var(--muted);
    }

    /* Full-Screen Step-by-Step Cooking Modal */
    .recipe-modal {
      position: absolute;
      inset: 0;
      background: var(--surface);
      z-index: 100;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .recipe-modal.open {
      transform: translateY(0);
    }

    .cooking-header {
      padding: 48px 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .cooking-header h2 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 250px;
    }

    .close-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: #f1f5f9;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* Progress Bar */
    .progress-track {
      height: 4px;
      background: #f1f5f9;
      width: 100%;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 16.66%;
      transition: width 0.25s ease;
    }

    /* Active Single-Step View */
    .step-display {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .step-img-wrap {
      width: 100%;
      height: 220px;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      background: #000;
    }

    .step-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .step-meta-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-light);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      width: fit-content;
    }

    .step-heading {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text);
    }

    .step-instructions {
      font-size: 0.88rem;
      line-height: 1.5;
      color: #374151;
    }

    /* Step Navigation Controls */
    .step-actions {
      display: flex;
      gap: 10px;
      padding: 10px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .btn-step {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .btn-step.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Bottom Menu Reel / All-Steps Strip */
    .menu-tray {
      background: #f8fafc;
      border-top: 1px solid var(--border);
      padding: 10px 14px 18px;
    }

    .tray-title {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .strip-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .strip-scroll::-webkit-scrollbar {
      display: none;
    }

    .mini-card {
      min-width: 68px;
      max-width: 68px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      opacity: 0.55;
      transition: all 0.2s ease;
      background: #fff;
      text-align: center;
    }

    .mini-card.active {
      opacity: 1;
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(16, 132, 63, 0.2);
    }

    .mini-card img {
      width: 100%;
      height: 44px;
      object-fit: cover;
      display: block;
    }

    .mini-label {
      font-size: 0.65rem;
      font-weight: 800;
      padding: 3px 0;
      color: var(--text);
    }

    /* App Tab Bar */
    .bottom-nav {
      height: 64px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: 8px;
    }

    .nav-btn {
      flex: 1;
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .nav-btn.active {
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="phone-frame">
    <div class="notch"></div>

    <header class="app-header">
      <h1>FreshPlate</h1>
      <span class="week-pill">Week 42</span>
    </header>

    <!-- PLANNER VIEW -->
    <div class="viewport">
      <div class="day-heading">Monday</div>

      <div class="meal-card" onclick="openStepFlow()">
        <img class="meal-thumb" src="https://images.unsplash.com/photo-1551504734-5ee1c4a1479b?w=300&q=80" alt="Miso Tacos">
        <div class="meal-info">
          <span class="meal-tag">Dinner (Tap to Cook)</span>
          <div class="meal-title">Miso Glazed Aubergine Tacos</div>
          <div class="meal-meta">40 mins • 6 Steps • Veggie</div>
        </div>
      </div>

      <div class="day-heading">Tuesday</div>
      <div class="meal-card">
        <img class="meal-thumb" src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300&q=80" alt="Salmon">
        <div class="meal-info">
          <span class="meal-tag">Dinner</span>
          <div class="meal-title">Pan-Seared Salmon & Sweet Potato</div>
          <div class="meal-meta">30 mins • 5 Steps</div>
        </div>
      </div>
    </div>

    <!-- SINGLE STEP COOKING FLOW MODAL -->
    <div id="recipe-modal" class="recipe-modal">
      
      <div class="cooking-header">
        <h2 id="modal-recipe-title">Miso Glazed Aubergine Tacos</h2>
        <button class="close-btn" onclick="closeStepFlow()">✕</button>
      </div>

      <div class="progress-track">
        <div id="progress-bar" class="progress-fill"></div>
      </div>

      <!-- Center Step Area -->
      <div class="step-display">
        <div class="step-img-wrap">
          <img id="active-step-img" src="" alt="Cooking Step">
        </div>
        <div class="step-meta-badge" id="active-step-badge">Step 1 of 6</div>
        <h3 class="step-heading" id="active-step-title">Get Prepped</h3>
        <p class="step-instructions" id="active-step-desc"></p>
      </div>

      <!-- Back / Next Controls -->
      <div class="step-actions">
        <button class="btn-step" id="prev-btn" onclick="prevStep()">← Previous</button>
        <button class="btn-step primary" id="next-btn" onclick="nextStep()">Next Step →</button>
      </div>

      <!-- Bottom Step Overview Strip -->
      <div class="menu-tray">
        <div class="tray-title">Recipe Step Overview</div>
        <div class="strip-scroll" id="step-strip">
          <!-- Populated dynamically via JS -->
        </div>
      </div>

    </div>

    <!-- Tab Bar -->
    <nav class="bottom-nav">
      <button class="nav-btn active"><span>Planner</span></button>
      <button class="nav-btn"><span>Pantry & Tools</span></button>
    </nav>
  </div>

  <script>
    // Exact 6 steps structured from the HelloFresh sheet
    const stepsData = [
      {
        num: 1,
        title: "Get Prepped",
        img: "https://images.unsplash.com/photo-1584776296944-ab6fb57b0bdd?w=600&q=80",
        desc: "Preheat oven to 200°C. Chop potatoes into 2cm wide wedges. Trim aubergine, halve lengthways, and cut into 2cm chunks. Spread onto separate trays, coat with oil, and season potatoes with salt and pepper."
      },
      {
        num: 2,
        title: "Roast & Pickle the Onion",
        img: "https://images.unsplash.com/photo-1565557623262-b51c2513a641?w=600&q=80",
        desc: "Roast wedges on the top shelf (25-30 mins) and aubergine on the middle shelf (20-25 mins). Thinly slice red onion. Toss half in a bowl with cider vinegar, sugar, and salt; leave to pickle."
      },
      {
        num: 3,
        title: "Finish the Prep",
        img: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=600&q=80",
        desc: "Finely shred iceberg lettuce. Cut lime into wedges and roughly chop coriander. In a small bowl, whisk miso paste, honey, soy sauce, sugar, and 1 tbsp water per person."
      },
      {
        num: 4,
        title: "Toast the Seeds",
        img: "https://images.unsplash.com/photo-1540420773420-3366772f4999?w=600&q=80",
        desc: "Toast sesame seeds in a dry pan on medium-high (2-3 mins). Stir half into the miso-soy sauce and mix the other half into mayonnaise."
      },
      {
        num: 5,
        title: "Finish the Aubergine",
        img: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&q=80",
        desc: "Fry remaining red onion in oil until softened (4-5 mins). Add roasted aubergine and miso mixture; bubble 3-5 mins until sticky. Warm taco shells in the oven for the last 2-3 mins."
      },
      {
        num: 6,
        title: "Assemble and Serve",
        img: "https://images.unsplash.com/photo-1551504734-5ee1c4a1479b?w=600&q=80",
        desc: "Spread sesame mayo onto tacos. Top with shredded lettuce, a squeeze of lime, sticky aubergine, pickled onion, and coriander. Serve with wedges."
      }
    ];

    let currentStepIndex = 0;

    function renderStrip() {
      const container = document.getElementById('step-strip');
      container.innerHTML = stepsData.map((step, idx) => `
        <div class="mini-card ${idx === currentStepIndex ? 'active' : ''}" onclick="jumpToStep(${idx})">
          <img src="${step.img}" alt="Step ${step.num}">
          <div class="mini-label">Step ${step.num}</div>
        </div>
      `).join('');
    }

    function renderCurrentStep() {
      const step = stepsData[currentStepIndex];
      document.getElementById('active-step-img').src = step.img;
      document.getElementById('active-step-badge').textContent = `Step ${step.num} of ${stepsData.length}`;
      document.getElementById('active-step-title').textContent = step.title;
      document.getElementById('active-step-desc').textContent = step.desc;

      // Progress bar
      const pct = ((currentStepIndex + 1) / stepsData.length) * 100;
      document.getElementById('progress-bar').style.width = pct + '%';

      // Prev/Next buttons
      document.getElementById('prev-btn').disabled = currentStepIndex === 0;
      document.getElementById('prev-btn').style.opacity = currentStepIndex === 0 ? '0.4' : '1';
      document.getElementById('next-btn').textContent = currentStepIndex === stepsData.length - 1 ? 'Finish ✓' : 'Next Step →';

      // Update active state in bottom reel
      renderStrip();
    }

    function jumpToStep(idx) {
      currentStepIndex = idx;
      renderCurrentStep();
    }

    function nextStep() {
      if (currentStepIndex < stepsData.length - 1) {
        currentStepIndex++;
        renderCurrentStep();
      } else {
        closeStepFlow();
      }
    }

    function prevStep() {
      if (currentStepIndex > 0) {
        currentStepIndex--;
        renderCurrentStep();
      }
    }

    function openStepFlow() {
      currentStepIndex = 0;
      renderCurrentStep();
      document.getElementById('recipe-modal').classList.add('open');
    }

    function closeStepFlow() {
      document.getElementById('recipe-modal').classList.remove('open');
    }
  </script>
</body>
</html>
